name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin
        run: python3 scripts/validate.py
      - name: Test secret-file hook
        run: |
          H=plugins/infinium-squad/hooks/block_secret_files.py
          echo '{"tool_input":{"file_path":"app/.env"}}' | python3 $H && exit 1 || [ $? -eq 2 ]
          echo '{"tool_input":{"file_path":"app/.env.example"}}' | python3 $H
          echo '{"tool_input":{"file_path":"src/main.ts"}}' | python3 $H

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --source=/repo --redact --verbose
